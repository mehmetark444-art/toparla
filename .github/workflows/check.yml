# Her push ve PR'da: birim testleri, biçim (ktlint), kod denetimi (detekt), Android Lint, derleme.
# Gizli değer gerektirmez: imza anahtarı ve API anahtarı depoda yoktur, burada da kullanılmaz
# (release derlenmez; cihaz testleri yalnız geliştirme bilgisayarında, telefonda koşar).
name: check

on:
  push:
    # claude/**: bulut oturumunda Android derlenemiyor; oradaki işin makine kontrolü buradadır.
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Depo tutarlılık denetimi belgelerde anılan commit'leri geçmişte arar.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Birim testleri
        run: ./gradlew --console=plain :domain:test
      - name: Biçim ve kod denetimi
        run: ./gradlew --console=plain ktlintCheck detekt
      - name: Android Lint ve derleme
        run: ./gradlew --console=plain :app:lintDebug :app:assembleDebug
      - name: Arayüz testleri (kontrast + ekran görüntüleri)
        run: ./gradlew --console=plain :ui:recordRoborazziDebug
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ekran-goruntuleri
          path: ui/src/test/screenshots/
      # Bulut oturumu Actions dosya deposuna erişemiyor; görüntüleri günlükten okuyabilsin diye metin olarak da yazılır.
      - name: Ekran görüntüleri (günlüğe, yalnız claude/** dalları)
        if: always() && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          for f in ui/src/test/screenshots/*.png; do
            [ -e "$f" ] || continue
            echo "@@PNG-BASLA $(basename "$f")"
            base64 -w 0 "$f"; echo
            echo "@@PNG-BITTI"
          done
      - name: Depo tutarlılığı
        run: node .claude/skills/dogrula/kontrol.mjs
      - name: Raporlar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raporlar
          path: |
            **/build/reports/
            **/build/test-results/

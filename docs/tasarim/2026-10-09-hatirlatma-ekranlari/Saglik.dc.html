<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Hatırlatma Sağlığı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.t-root button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div class="t-root" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}">
  <div style="display: flex; align-items: center; gap: 8px; padding: 20px 24px 8px 12px">
    <button aria-label="Geri" style="width: 48px; height: 48px; border: 0; background: transparent; color: {{c.ink2}}; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 style="margin: 0; font-size: 20px; font-weight: 600">Hatırlatma Sağlığı</h1>
  </div>

  <div style="flex: 1 1 auto; overflow: hidden; padding: 8px 24px 0 24px; display: flex; flex-direction: column; gap: 24px">
    <div style="padding: 24px; border-radius: 20px; background: {{c.carriedBg}}; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 20px; font-weight: 600; color: {{c.carriedInk}}">2 ayar eksik</div>
      <div style="font-size: 16px; line-height: 24px; color: {{c.ink}}">Bunlar olmadan telefon, uygulama kapanınca hatırlatmaları geri başlatmayabilir.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; color: {{c.ink2}}">Düzeltilecekler</div>
      <sc-for list="{{todo}}" as="r" hint-placeholder-count="2">
        <div style="min-height: 64px; display: flex; align-items: center; gap: 12px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.carriedInk}}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
            <div style="font-size: 13px; color: {{c.ink2}}">{{r.why}}</div>
          </div>
          <button style="min-height: 48px; padding: 0 16px; border: 0; border-radius: 16px; background: {{c.soft}}; color: {{c.primaryInk}}; font-size: 16px; font-weight: 600">Düzelt</button>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; color: {{c.ink2}}">Yerinde olanlar</div>
      <sc-for list="{{ok}}" as="r" hint-placeholder-count="5">
        <div style="min-height: 48px; display: flex; align-items: center; gap: 12px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.success}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
          <div style="flex: 1 1 auto; font-size: 16px">{{r.name}}</div>
          <div style="font-size: 13px; color: {{c.ink2}}">{{r.value}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 16px 24px 28px 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: {{c.ink2}}; text-align: center">Emin olmak için 20 saniyelik bir deneme yapabilirsin.</div>
    <button style="height: 56px; border: 0; border-radius: 20px; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 16px; font-weight: 600">Hatırlatmaları sına</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["koyu","acik"],"default":"koyu"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'koyu') !== 'acik';
    const c = dark
      ? { bg: '#1B1917', ink: '#ECE7DF', ink2: '#AFA79B', primary: '#8DBBA9', onPrimary: '#12261E', primaryInk: '#8DBBA9', soft: 'rgba(141,187,169,0.16)', success: '#8CC2A0', carriedInk: '#E0BC6A', carriedBg: '#4A3E1E' }
      : { bg: '#FAF7F2', ink: '#2B2825', ink2: '#625B52', primary: '#47705F', onPrimary: '#FFFFFF', primaryInk: '#47705F', soft: 'rgba(71,112,95,0.12)', success: '#3E7553', carriedInk: '#7C5B12', carriedBg: '#F6EBCF' };
    return {
      c,
      todo: [
        { name: 'Otomatik başlatma', why: 'Uygulama kapanırsa kendiliğinden geri gelsin.' },
        { name: 'Pil kısıtlaması', why: 'Telefon uyurken alarmlar gecikmesin.' },
      ],
      ok: [
        { name: 'Bildirim izni', value: 'Açık' },
        { name: 'Tam ekran kart', value: 'Açık' },
        { name: 'Sessizde kritik ses', value: 'Açık' },
        { name: 'Son hatırlatma', value: 'Bugün 21:47, vaktinde' },
        { name: 'Bekleyen hatırlatma', value: '3' },
      ],
    };
  }
}
</script>
</body>
</html>

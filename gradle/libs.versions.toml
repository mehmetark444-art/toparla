# Sürümler resmi kaynaktan doğrulanıp buraya kilitlenir (blueprint A0-3).
# Doğrulama: 7–8 Ekim 2026 — Google Maven, Maven Central, Gradle Plugin Portal.
[versions]
agp = "9.4.1"            # Gradle 9.6.0 ister; JDK 17+; en yüksek API 37
kotlin = "2.4.20"
junit = "6.1.3"          # JUnit Jupiter (blueprint'teki "JUnit 5" ailesinin güncel sürümü); yalnız JVM testleri
junit4 = "4.13.2"        # Cihaz testleri (AndroidX Test JUnit 4 ister)
sdk = "36"
ksp = "2.3.12"           # KSP2; sürümü Kotlin sürümünden bağımsız
room = "3.0.3"           # androidx.room3
sqlite = "2.7.1"         # Room 3.0.3 bu sürümü ister (POM)
hilt = "2.60.1"
coroutines = "1.11.0"
datastore = "1.2.1"
timber = "5.0.1"
leakcanary = "2.14"      # 3.0 henüz alfa
detekt = "1.23.8"        # 2.0 henüz alfa
ktlintGradle = "14.2.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
litertlm = "0.18.0"      # Cihaz içi LLM çalışma zamanı; şimdilik yalnız :spike
# Doğrulama: 9 Ekim 2026 — developer.android.com BOM eşleme sayfası, Maven Central (Robolectric, Roborazzi,
# Compose derleyici eklentisi = Kotlin sürümü), Gradle Plugin Portal.
# Compose 1.12 (BOM 2026.08+) compileSdk 37 istiyor (CI, checkDebugAarMetadata); proje 36'da kaldığı için
# 1.11.x'in son BOM'u: ui 1.11.4, material3 1.4.0.
composeBom = "2026.06.01"
robolectric = "4.17"     # SDK 36 desteği 4.16'dan beri; SDK 36 testleri JDK 21 ister
roborazzi = "1.76.0"
# Doğrulama: 9 Ekim 2026 — developer.android.com sürüm sayfaları, Maven Central. Navigation 2.10 compileSdk 37 istiyor
# (2.10.0-alpha03 notu), bu yüzden 2.9'un son kararlısı. kotlinx-serialization: tür güvenli rotalar (blueprint D0).
activityCompose = "1.13.0"
navigation = "2.9.8"
serializationJson = "1.11.0"

[libraries]
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
litertlm = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
